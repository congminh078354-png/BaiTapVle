<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cô hái mơ</title>
    <style>
        .box {
            border: 1.5px solid #000;
            width: 320px;
            padding: 20px;
            margin: 20px auto;
            font-family: "Times New Roman", Times, serif;
            line-height: 1.5;
        }
        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="title">CÔ HÁI MƠ</div>
        
        <p>
            <i>Thơ thẫn đường chiều một khách thơ,</i><br>
            <i>Say nhìn xa rặng núi <u>xanh lơ</u>,</i><br>
            Khi trời lặng lẽ và trong trẻo,<br>
            Thấp thoáng rừng mơ, <b>Cô hái mơ</b>.<br>
            Tác giả: <u><s style="font-weight: bold;">Vô danh</s></u>
        </p>
    </div>

</body>
</html>
