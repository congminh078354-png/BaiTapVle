<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        p {
            font-size: 24px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }
        .blue {
            color: blue;
        }
        .red {
            color: red;
        }
        .green {
            color: green;
        }
    </style>
</head>
<body>

    <p>Once the <span class="blue">blue</span> plum met the <span class="red">red</span> tomato playing with the <span class="green">green</span> cucumber.</p>

</body>
</html>
